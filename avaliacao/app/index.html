<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Cursos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Cadastro de Cursos</h1>

    <form id="form-curso">
      <label for="nome">Nome do curso</label>
      <input type="text" id="nome" name="nome" required>

      <label for="instrutor">Instrutor responsável</label>
      <input type="text" id="instrutor" name="instrutor" required>

      <label for="preco">Preço (R$)</label>
      <input type="number" id="preco" name="preco" step="0.01" min="0" required>

      <label for="vagas">Quantidade de vagas</label>
      <input type="number" id="vagas" name="vagas" step="1" min="0" required>

      <button type="submit">Cadastrar curso</button>
    </form>

    <p id="mensagem" role="status"></p>

    <p><a href="cursos.html">Listar todos os cursos</a></p>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
