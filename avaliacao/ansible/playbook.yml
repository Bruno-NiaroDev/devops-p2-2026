---
# 1) Garante que as duas VMs estao prontas para usar Docker
- name: Preparar VMs
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Aguardar SSH disponivel
      ansible.builtin.wait_for_connection:
        timeout: 300

    - name: Aguardar o cloud-init terminar
      ansible.builtin.command: cloud-init status --wait
      register: cloud_init
      changed_when: false
      failed_when: cloud_init.rc not in [0, 2]

    - name: Garantir Docker instalado (caso o cloud-init nao tenha instalado)
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Garantir Docker ativo e habilitado
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

# 2) VM2: API Node.js + MySQL em conteineres
- name: Implantar API e banco na VM2
  hosts: api
  become: true

  vars:
    api_dir: /opt/cursos-api
    web_origin: "http://{{ hostvars['vm1'].ansible_host }}"

  tasks:
    - name: Copiar arquivos da API
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../api/"
        dest: "{{ api_dir }}/"
        mode: "0644"
        directory_mode: "0755"

    - name: Definir origem permitida no CORS (IP da VM1)
      ansible.builtin.copy:
        dest: "{{ api_dir }}/.env"
        content: |
          CORS_ORIGIN={{ web_origin }}
        mode: "0600"

    - name: Subir MySQL e API com Docker Compose
      ansible.builtin.command:
        cmd: docker compose up -d --build
        chdir: "{{ api_dir }}"
      register: compose
      changed_when: "'Started' in compose.stderr or 'Recreated' in compose.stderr or 'Created' in compose.stderr"

    - name: Aguardar API responder
      ansible.builtin.uri:
        url: http://localhost:3000/health
        status_code: 200
      register: health
      until: health.status == 200
      retries: 30
      delay: 5

# 3) VM1: servidor web + HTML em conteiner
- name: Implantar aplicacao web na VM1
  hosts: web
  become: true

  vars:
    web_dir: /opt/cursos-web
    api_url: "http://{{ hostvars['vm2'].ansible_host }}:3000"

  tasks:
    - name: Copiar arquivos da aplicacao web
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../app/"
        dest: "{{ web_dir }}/"
        mode: "0644"
        directory_mode: "0755"

    - name: Apontar a aplicacao para a API da VM2
      ansible.builtin.copy:
        dest: "{{ web_dir }}/config.js"
        content: |
          window.API_URL = "{{ api_url }}";
        mode: "0644"

    - name: Construir imagem do servidor web
      ansible.builtin.command:
        cmd: docker build -t cursos-web:local .
        chdir: "{{ web_dir }}"
      changed_when: true

    - name: Remover conteiner antigo (se existir)
      ansible.builtin.command: docker rm -f cursos-web
      register: rm_web
      changed_when: rm_web.rc == 0
      failed_when: false

    - name: Iniciar conteiner do servidor web na porta 80
      ansible.builtin.command:
        argv:
          - docker
          - run
          - -d
          - --name
          - cursos-web
          - --restart
          - unless-stopped
          - -p
          - "80:80"
          - cursos-web:local
      changed_when: true

    - name: Verificar pagina web
      ansible.builtin.uri:
        url: http://localhost/
        status_code: 200
      register: pagina
      until: pagina.status == 200
      retries: 10
      delay: 3

    - name: Mostrar enderecos
      ansible.builtin.debug:
        msg:
          - "Aplicacao web: http://{{ ansible_host }}/"
          - "API: {{ api_url }}/cursos"
